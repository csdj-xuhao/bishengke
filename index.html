
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b3b">
  <title>崩壞：星穹鐵道｜4.6 版本活動</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #071b3b;
      --blue: #1268b8;
      --cyan: #70e7ff;
      --gold: #ffe6a0;
      --white: #f6fbff;
    }

    body {
      min-height: 100vh;
      padding: 24px 14px 40px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at top, #174b82 0%, transparent 48%),
        linear-gradient(160deg, #06132b, #0b2c57 55%, #07172e);
    }

    .page {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 18px;
    }

    .brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .version {
      padding: 7px 12px;
      border: 1px solid rgba(112, 231, 255, .55);
      border-radius: 20px;
      background: rgba(23, 93, 153, .4);
      color: #a8f2ff;
      font-size: 12px;
      font-weight: 700;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 22px 16px 24px;
      border: 1px solid rgba(132, 220, 255, .6);
      border-radius: 24px;
      background: linear-gradient(
        155deg,
        rgba(24, 79, 133, .95),
        rgba(5, 22, 51, .98) 75%
      );
      box-shadow:
        0 0 30px rgba(40, 163, 255, .16),
        inset 0 0 28px rgba(80, 194, 255, .08);
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -100px;
      right: -110px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: rgba(65, 190, 255, .13);
      filter: blur(30px);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      margin-bottom: 10px;
      color: var(--cyan);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      position: relative;
      margin-bottom: 8px;
      color: #fff;
      text-align: center;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.35;
      font-weight: 900;
      text-shadow: 0 3px 15px rgba(69, 192, 255, .45);
    }

    .subtitle {
      position: relative;
      margin-bottom: 20px;
      color: #c9eaff;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
    }

    .poster-frame {
      position: relative;
      overflow: hidden;
      padding: 5px;
      border: 1px solid rgba(130, 225, 255, .8);
      border-radius: 17px;
      background: linear-gradient(135deg, #83f0ff, #2465b4, #ffe4a0);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      object-fit: contain;
      background: #0b2c57;
    }

    .poster-note {
      margin-top: 10px;
      color: #b9d8f3;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    .reward-card {
      margin-top: 20px;
      padding: 20px 16px;
      border: 1px solid rgba(122, 205, 255, .35);
      border-radius: 18px;
      background: rgba(4, 20, 46, .75);
      text-align: center;
    }

    .reward-label {
      color: #9bdfff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .reward-title {
      margin-top: 8px;
      color: var(--gold);
      font-size: 23px;
      font-weight: 900;
    }

    .reward-description {
      margin-top: 8px;
      color: #c6d9ed;
      font-size: 13px;
      line-height: 1.9;
    }

    .action-button {
      display: flex;
      width: 100%;
      min-height: 52px;
      margin-top: 18px;
      align-items: center;
      justify-content: center;
      border: 1px solid #c0f6ff;
      border-radius: 13px;
      background: linear-gradient(100deg, #1684d8, #49c9ef);
      box-shadow: 0 5px 20px rgba(26, 162, 240, .25);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      transition: transform .2s, filter .2s;
      cursor: pointer;
    }

    .action-button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    .info-card {
      margin-top: 16px;
      padding: 17px;
      border: 1px solid rgba(125, 190, 239, .22);
      border-radius: 16px;
      background: rgba(5, 19, 42, .6);
    }

    .info-card h2 {
      margin-bottom: 10px;
      color: #a8eaff;
      font-size: 15px;
    }

    .info-card p {
      color: #c5d7e9;
      font-size: 13px;
      line-height: 2;
    }

    .notice {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, .18);
      color: #8faac4;
      font-size: 11px;
      line-height: 1.8;
    }

    footer {
      padding-top: 22px;
      color: #7894b2;
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 360px) {
      body {
        padding: 14px 10px 28px;
      }

      .hero {
        padding: 18px 12px;
      }

      .reward-title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">
      <div class="brand">STAR RAIL · EVENT</div>
      <div class="version">4.6 VERSION</div>
    </header>

    <section class="hero">
      <p class="eyebrow">SPECIAL EVENT</p>

      <h1>崩壞：星穹鐵道</h1>

      <p class="subtitle">
        4.6 版本活動企劃<br>
        <strong>來自真珠的禮物</strong>
      </p>

      <!-- 活動主視覺圖片：event.png 請放在 HTML 同一個資料夾 -->
      <div class="poster-frame">
        <img
          class="poster"
          src="event.png"
          alt="崩壞：星穹鐵道 4.6 版本活動主視覺"
        >
      </div>

      <p class="poster-note">
        活動主視覺展示｜4.6 版本主題
      </p>

      <section class="reward-card">
        <p class="reward-label">EVENT INFORMATION</p>

        <h2 class="reward-title">來自真珠的禮物</h2>

        <p class="reward-description">
          查看活動資訊與相關內容。<br>
        </p>

        <!-- 點擊後前往指定 LINE 連結 -->
        <a
          class="action-button"
          href="https://lin.ee/7odxmu4"
          target="_blank"
          rel="noopener noreferrer"
        >
          立即前往 LINE →
        </a>
      </section>
    </section>

    <section class="info-card" id="event-details">
      <h2>✦ 活動資訊</h2>

      <p>
        活動主題：來自真珠的禮物<br>
        遊戲名稱：崩壞：星穹鐵道<br>
        版本資訊：4.6 版本<br>
      </p>

      <div class="notice">
      </div>
    </section>

    <footer>
      FAN-MADE EVENT PAGE<br>
     
    </footer>

  </main>
</body>
</html>
