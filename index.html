
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>披薩歡樂派對｜活動頁展示範本</title>
<style>
:root {
  --red: #d71920;
  --deep-red: #a90f16;
  --cream: #fff8e9;
  --yellow: #ffd84d;
  --ink: #171311;
  --muted: #756b60;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px 12px;
  color: var(--ink);
  font-family: Arial, "Noto Sans TC", sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #ffe6a6 0 2px, transparent 3px),
    radial-gradient(circle at 90% 30%, #ffe6a6 0 2px, transparent 3px),
    #f2e8d5;
  background-size: 26px 26px, 34px 34px, auto;
}
.page {
  width: min(100%, 430px);
  margin: 0 auto;
  overflow: hidden;
  border: 3px solid var(--ink);
  border-radius: 26px;
  background: var(--cream);
  box-shadow: 6px 7px 0 var(--ink);
}
.demo-note {
  margin: 12px 14px 0;
  padding: 7px 9px;
  border: 1px solid #e3c8a0;
  border-radius: 9px;
  background: #fff0cb;
  color: #644a20;
  font-size: 10px;
  line-height: 1.5;
  text-align: center;
}
.hero {
  position: relative;
  padding: 19px 18px 21px;
  overflow: hidden;
  background: var(--red);
  color: white;
  border-bottom: 4px solid var(--ink);
}
.hero:before {
  content: "✦";
  position: absolute;
  right: 13px;
  top: 4px;
  color: var(--yellow);
  font-size: 58px;
  transform: rotate(14deg);
  opacity: .9;
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}
.pizza-mark {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  flex: 0 0 45px;
  border: 2px solid white;
  border-radius: 50%;
  background: var(--yellow);
  color: var(--ink);
  font-size: 25px;
  box-shadow: 2px 3px 0 var(--ink);
}
.brand-name {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
  opacity: .95;
}
.hero h1 {
  position: relative;
  z-index: 1;
  margin: 17px 0 7px;
  font-size: clamp(29px, 8vw, 39px);
  font-weight: 1000;
  line-height: 1.08;
  letter-spacing: -1px;
  text-shadow: 2px 3px 0 var(--deep-red);
}
.hero p {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.6;
}
.hero-tag {
  display: inline-block;
  margin-top: 13px;
  padding: 7px 11px;
  border: 2px solid var(--ink);
  border-radius: 7px;
  background: var(--yellow);
  color: var(--ink);
  font-size: 12px;
  font-weight: 950;
  transform: rotate(-2deg);
}
.content { padding: 15px; }
.section-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 1px 0 10px;
  font-size: 16px;
  font-weight: 950;
}
.section-heading .dot {
  display: inline-grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: var(--yellow);
  border: 2px solid var(--ink);
  font-size: 14px;
}
.feature-card {
  padding: 13px;
  margin-bottom: 14px;
  border: 2px solid var(--ink);
  border-radius: 16px;
  background: white;
  box-shadow: 3px 4px 0 var(--ink);
}
.feature-top {
  display: flex;
  align-items: center;
  gap: 12px;
}
.pizza-art {
  display: grid;
  place-items: center;
  flex: 0 0 78px;
  height: 78px;
  border-radius: 14px;
  background: #ffe8a2;
  font-size: 48px;
}
.feature-card h2 {
  margin: 0 0 5px;
  font-size: 17px;
  font-weight: 950;
}
.feature-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.6;
}
.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.pill {
  padding: 5px 8px;
  border: 1px solid #d5c7b1;
  border-radius: 99px;
  background: #fff7e5;
  font-size: 10px;
  font-weight: 900;
}
.section-title {
  margin: 15px 0 8px;
  font-size: 12px;
  font-weight: 950;
}
.form-row {
  display: flex;
  gap: 8px;
  margin-bottom: 9px;
}
input {
  min-width: 0;
  flex: 1;
  width: 100%;
  padding: 14px 15px;
  border: 2px solid var(--ink);
  border-radius: 28px;
  outline: none;
  background: #fff5d5;
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
}
input:focus { box-shadow: 0 0 0 3px #ffd84d88; }
input::placeholder { color: #897f73; opacity: 1; }
button {
  flex: 0 0 104px;
  padding: 12px 8px;
  border: 2px solid var(--ink);
  border-radius: 28px;
  background: var(--red);
  color: white;
  font-size: 12px;
  font-weight: 950;
  cursor: pointer;
  box-shadow: 3px 4px 0 var(--ink);
}
button:active {
  transform: translate(1px, 2px);
  box-shadow: 1px 1px 0 var(--ink);
}
.hint {
  margin: 3px 0 9px;
  font-size: 10px;
  font-weight: 800;
  color: var(--muted);
}
.consent {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 8px 0;
  font-size: 10px;
  line-height: 1.5;
}
.consent input {
  flex: 0 0 auto;
  width: 13px;
  height: 13px;
  margin: 1px 0 0;
  accent-color: var(--red);
}
.status {
  min-height: 17px;
  margin: 7px 2px 0;
  color: #6b3a16;
  font-size: 10px;
  line-height: 1.5;
}
.bottom-banner {
  margin-top: 13px;
  padding: 12px;
  border-radius: 14px;
  background: var(--ink);
  color: white;
  text-align: center;
}
.bottom-banner strong {
  display: block;
  color: var(--yellow);
  font-size: 16px;
  font-weight: 950;
}
.bottom-banner span {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  line-height: 1.5;
}
.notice {
  margin-top: 13px;
  padding: 11px 12px;
  border: 2px solid var(--ink);
  border-radius: 14px;
  background: #fffdf7;
  font-size: 10px;
  line-height: 1.7;
}
.notice strong { font-size: 12px; }
.notice ol { margin: 5px 0 0; padding-left: 17px; }
@media (max-width: 360px) {
  body { padding: 12px 8px; }
  .content { padding: 12px; }
  .form-row { gap: 7px; }
  input { padding: 13px 12px; font-size: 12px; }
  button { flex-basis: 92px; font-size: 11px; }
  .pizza-art {
    flex-basis: 65px;
    height: 65px;
    font-size: 40px;
  }
}
</style>
</head>
<body>
<main class="page">
  <p class="demo-note">
    官方展示範本｜品牌活動、餐點內容與登記功能皆為示意
  </p>

  <header class="hero">
    <div class="brand-row">
      <div class="pizza-mark" aria-hidden="true">🍕</div>
      <div class="brand-name">PIZZA PARTY · 活動專區</div>
    </div>
    <h1>披薩歡樂派對！</h1>
    <p>趁熱分享好滋味，揪上朋友一起享受披薩時光。</p>
    <span class="hero-tag">美味開場・歡樂加倍</span>
  </header>

  <div class="content">
    <div class="section-heading">
      <span class="dot">✦</span>本週派對主題
    </div>

    <section class="feature-card">
      <div class="feature-top">
        <div class="pizza-art" aria-hidden="true">🍕</div>
        <div>
          <h2>一起來場披薩派對</h2>
          <p>香濃起司、滿滿配料，讓每一次相聚都更有味道！</p>
        </div>
      </div>
      <div class="pill-row">
        <span class="pill">🍅 經典番茄風味</span>
        <span class="pill">🧀 濃郁起司感</span>
        <span class="pill">🎉 聚會靈感</span>
      </div>
    </section>

    <div class="section-heading">
      <span class="dot">✉</span>活動消息通知
    </div>
    <p class="hint">
      
    </p>

    <form id="demoForm">
      <div class="form-row">
        <input
          type="tel"
          id="phone"
          placeholder="+886 09xx xxx xxx"
          autocomplete="off"
          aria-label="展示用手機號碼"
        >
        <button type="button" id="notifyBtn">立即申請</button>
      </div>

      <div class="section-title" style="margin-top: 8px;">
        輸入六位數驗證碼完成登記
      </div>

      <div class="form-row">
        <input
          type="text"
          id="code"
          inputmode="numeric"
          maxlength="6"
          placeholder="🔑 請輸入 6 位數驗證碼"
          autocomplete="off"
          aria-label="展示用驗證碼"
        >
        <button type="submit">完成登記</button>
      </div>

      <div class="consent">
        <input type="checkbox" id="agree">
        <label for="agree">
          我已了解
        </label>
      </div>

      <p class="status" id="status" role="status">
        展示模式：不會收集、儲存或傳送表單資料。
      </p>
    </form>

    <div class="bottom-banner">
      <strong>熱愛披薩，就一起開趴！</strong>
      <span>實際餐點、價格與活動資訊請以品牌官方公告為準。</span>
    </div>

    <section class="notice">
      <strong>● 活動頁使用說明</strong>
      <ol>
      </ol>
    </section>
  </div>
</main>

<script>
const status = document.getElementById('status');

document.getElementById('notifyBtn').addEventListener('click', () => {
  status.textContent =
    '展示模式：尚未報名，也不會發送任何通知。';
});

document.getElementById('demoForm').addEventListener('submit', (event) => {
  event.preventDefault();

  if (!document.getElementById('agree').checked) {
    status.textContent = '請先勾選已了解展示頁說明。';
    return;
  }

  status.textContent =
    '展示完成：表單未送出，資料沒有被儲存。';

  document.getElementById('phone').value = '';
  document.getElementById('code').value = '';
});
</script>
</body>
</html>
